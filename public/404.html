<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — Colleague AI</title>
<style>
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F5F0E8;color:#1D1B1A;display:grid;place-items:center;min-height:100vh}
  main{text-align:center;padding:40px;max-width:560px}
  h1{font-size:42px;margin:0 0 8px}
  p{color:#555;line-height:1.6}
  a.btn{display:inline-block;margin-top:18px;padding:12px 26px;background:#1D1B1A;color:#F5F0E8;border-radius:999px;text-decoration:none}
  .code{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#8a857d;letter-spacing:.04em;margin-bottom:14px}
</style>
<style id="cai-fixed-backtop-css">
#cai-fixed-backtop {
position: fixed !important;
right: 22px !important;
bottom: 22px !important;
width: 48px !important;
height: 48px !important;
border: 0 !important;
border-radius: 999px !important;
background: #1d1b1a !important;
color: #fff !important;
font-size: 16px !important;
font-weight: 700 !important;
z-index: 2147483647 !important;
cursor: pointer !important;
display: none !important;
align-items: center !important;
justify-content: center !important;
line-height: 1 !important;
}
#cai-fixed-backtop[data-show="true"] {
display: flex !important;
}
</style>
<script id="cai-fixed-backtop-js">
(function () {
  function ready(fn) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fn);
    else fn();
  }
  function getY() {
    return window.scrollY ||
      (document.scrollingElement && document.scrollingElement.scrollTop) ||
      (document.documentElement && document.documentElement.scrollTop) ||
      (document.body && document.body.scrollTop) ||
      0;
  }
  function forceTop() {
    var html = document.documentElement;
    var body = document.body;
    var oldHtml = html ? html.style.scrollBehavior : "";
    var oldBody = body ? body.style.scrollBehavior : "";
    if (html) html.style.scrollBehavior = "auto";
    if (body) body.style.scrollBehavior = "auto";
    try { window.scrollTo(0, 0); } catch (e) {}
    try { window.scrollTo({ top: 0, left: 0, behavior: "auto" }); } catch (e) {}
    var nodes = [document.scrollingElement, html, body];
    for (var i = 0; i < nodes.length; i += 1) {
      if (!nodes[i]) continue;
      try { nodes[i].scrollTop = 0; nodes[i].scrollLeft = 0; } catch (e) {}
    }
    if (html) html.style.scrollBehavior = oldHtml || "";
    if (body) body.style.scrollBehavior = oldBody || "";
  }
  ready(function () {
    var button = document.getElementById("cai-fixed-backtop");
    if (!button) {
      button = document.createElement("button");
      button.id = "cai-fixed-backtop";
      button.type = "button";
      button.textContent = "Top";
      button.setAttribute("aria-label", "Back to top");
      document.body.appendChild(button);
    }
    function show() {
      button.setAttribute("data-show", getY() > 120 ? "true" : "false");
    }
    function clickHandler(event) {
      if (event) { event.preventDefault(); event.stopPropagation(); }
      forceTop();
      if (window.requestAnimationFrame) window.requestAnimationFrame(forceTop);
      window.setTimeout(forceTop, 50);
      window.setTimeout(forceTop, 150);
      window.setTimeout(forceTop, 400);
      window.setTimeout(show, 450);
    }
    button.addEventListener("click", clickHandler, true);
    button.addEventListener("pointerup", clickHandler, true);
    button.addEventListener("touchend", clickHandler, true);
    window.addEventListener("scroll", show, { passive: true });
    window.addEventListener("load", show);
    show();
  });
}());
</script>
</head>
<body>
<main>
  <div class="code">// HTTP 404</div>
  <h1>Page not found.</h1>
  <p>The page you are looking for does not exist or has moved. The agent catalogue is the best place to start.</p>
  <a class="btn" href="https://www.colleagueai.ai/agents">Browse the agent catalogue →</a>
  <p style="font-size:13px;margin-top:22px">Or email <a href="mailto:hello@colleagueai.ai">hello@colleagueai.ai</a></p>
</main>
</body>
</html>
