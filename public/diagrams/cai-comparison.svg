<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .val{font-size:13px;fill:#68635b}
      .lbl{font-size:14px;fill:#22211F}
    </style>
  </defs>
  <rect width="940" height="620" fill="#FBF8F2"/>

  <!-- Header -->
  <text x="50" y="52" class="mono" font-size="13" letter-spacing="3" fill="#c65d3a">WHY COLLEAGUEAI</text>
  <text x="50" y="90" class="serif" font-size="30" fill="#22211F">Build it yourself, buy generic, or ship both.</text>

  <!-- Highlight panel for ColleagueAI column -->
  <rect x="686" y="120" width="208" height="474" rx="14" fill="#fbf1ec" stroke="#c65d3a" stroke-width="2"/>

  <!-- Column headers -->
  <text x="472" y="150" class="mono" font-size="12" letter-spacing="1.5" fill="#8a857c" text-anchor="middle">BUILD IN-HOUSE</text>
  <text x="620" y="150" class="mono" font-size="12" letter-spacing="1.5" fill="#8a857c" text-anchor="middle">GENERIC PLATFORM</text>
  <text x="790" y="150" class="serif" font-size="18" fill="#c65d3a" text-anchor="middle" font-weight="bold">ColleagueAI</text>

  <!-- Rows -->
  <!-- row template: label | build | generic | colleagueai(check) -->
  <g>
    <!-- Row 1 -->
    <text x="50" y="196" class="lbl">Time to a pilot</text>
    <text x="472" y="196" class="val" text-anchor="middle">Months, blank prompt</text>
    <text x="620" y="196" class="val" text-anchor="middle">Weeks, governance later</text>
    <text x="708" y="196" font-size="13" fill="#c65d3a">✓</text>
    <text x="724" y="196" font-size="13" fill="#22211F">Weeks, governance in</text>
    <line x1="50" y1="216" x2="894" y2="216" stroke="#ece4d7" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="50" y="256" class="lbl">Risk classification</text>
    <text x="472" y="256" class="val" text-anchor="middle">Do-it-yourself</text>
    <text x="620" y="256" class="val" text-anchor="middle">Basic logging</text>
    <text x="708" y="256" font-size="13" fill="#c65d3a">✓</text>
    <text x="724" y="256" font-size="13" fill="#22211F">Tier on every agent</text>
    <line x1="50" y1="276" x2="894" y2="276" stroke="#ece4d7" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="50" y="316" class="lbl">Human accountability</text>
    <text x="472" y="316" class="val" text-anchor="middle">Ad hoc</text>
    <text x="620" y="316" class="val" text-anchor="middle">Rarely defined</text>
    <text x="708" y="316" font-size="13" fill="#c65d3a">✓</text>
    <text x="724" y="316" font-size="13" fill="#22211F">Named human, per tier</text>
    <line x1="50" y1="336" x2="894" y2="336" stroke="#ece4d7" stroke-width="1"/>

    <!-- Row 4 -->
    <text x="50" y="376" class="lbl">Audit evidence</text>
    <text x="472" y="376" class="val" text-anchor="middle">After the fact</text>
    <text x="620" y="376" class="val" text-anchor="middle">Partial</text>
    <text x="708" y="376" font-size="13" fill="#c65d3a">✓</text>
    <text x="724" y="376" font-size="13" fill="#22211F">Generated by default</text>
    <line x1="50" y1="396" x2="894" y2="396" stroke="#ece4d7" stroke-width="1"/>

    <!-- Row 5 -->
    <text x="50" y="436" class="lbl">ROI proof</text>
    <text x="472" y="436" class="val" text-anchor="middle">Your business case</text>
    <text x="620" y="436" class="val" text-anchor="middle">Vendor claims</text>
    <text x="708" y="436" font-size="13" fill="#c65d3a">✓</text>
    <text x="724" y="436" font-size="13" fill="#22211F">Calculator + validation</text>
    <line x1="50" y1="456" x2="894" y2="456" stroke="#ece4d7" stroke-width="1"/>

    <!-- Row 6 -->
    <text x="50" y="496" class="lbl">Where your data lives</text>
    <text x="472" y="496" class="val" text-anchor="middle">Your tenant</text>
    <text x="620" y="496" class="val" text-anchor="middle">Vendor cloud</text>
    <text x="708" y="496" font-size="13" fill="#c65d3a">✓</text>
    <text x="724" y="496" font-size="13" fill="#22211F">Your tenant, always</text>
  </g>

  <!-- Footer badges -->
  <text x="790" y="556" class="mono" font-size="11" letter-spacing="1" fill="#c65d3a" text-anchor="middle">GOVERNANCE INCLUDED</text>
  <text x="790" y="576" class="mono" font-size="10.5" letter-spacing="0.5" fill="#8a857c" text-anchor="middle">EU AI Act · DORA · ISO 42001</text>
</svg>
