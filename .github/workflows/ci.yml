name: CI

"on":
  push:
    branches:
      - main
      - golive-fixes
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: HTML integrity gate (tag balance, leaked code, orphaned tags, anchors)
        run: node tests/integrity-check.mjs

      - name: Unit tests
        run: npm run test:run

      - name: Webhook security and idempotency
        run: node --test tests/webhook.test.mjs

      - name: Rate limiter
        run: node --test tests/ratelimit.test.mjs

      # Guards the rule this endpoint used to break: never report success for a
      # booking that was not actually stored. It previously logged the visitor's
      # details, returned {success:true}, and delivered the lead nowhere.
      - name: Demo booking (lead is stored, or the visitor is told it was not)
        run: node --test tests/demo-booking.test.mjs

      - name: Partner commission ledger (approval gate, rate locking, reversals)
        run: node --test tests/commission-ledger.test.mjs

      # Verified passing 8/8, including the revenue-critical assertions (STORE
      # config carries no live price while checkout is off, partner attribution
      # survives navigation, the pay CTA hands off client_reference_id). It was
      # the last step here that could fail silently, so it gates now.
      - name: DOM smoke
        run: node --test tests/dom-smoke.test.mjs

      - name: i18n integrity
        run: node tests/audit-i18n.mjs

      - name: Locale smoke (scripts execute in every language)
        run: node --test tests/locale-smoke.test.mjs
      - name: Continuous Certification lifecycle
        run: node --test tests/certification.test.mjs
      - name: One language per page (localized output, dates, menu)
        run: node --test tests/language-unity.test.mjs
      - name: One price list everywhere (config/pricing.json vs every surface)
        run: node --test tests/pricing-consistency.test.mjs
      - name: End-to-end journeys (buyer path, partner path, navigation, localisation)
        run: node --test tests/journey.test.mjs

      - name: Secret scan of build output
        run: node tests/scan-bundle.mjs

      # This gates again as of the audit-headers repair. It had been silenced with
      # continue-on-error and no note explaining why, and was exiting 1 on every
      # run: 62 failures, 54 of them bugs in the checks rather than defects in the
      # site (a canonical expectation left over from when / redirected to /agents,
      # a title heuristic that flagged correctly formed titles, and a single 2 KB
      # content bar applied to pages like /imprint that are legitimately 515 bytes).
      # If you silence it again, say here what you are waiting on and why.
      - name: Headers and SEO audit against local replica
        run: |
          node tests/local-server.mjs 4173 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:4173/" && break
            sleep 1
          done
          BASE_URL=http://localhost:4173 node tests/audit-headers.mjs

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-results
          path: tests/results/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build and static QA audit
        run: npm run build && npm run qa:static

      # This job installed a browser but never used it: the step above is a
      # static Node audit, so the Playwright specs in tests/e2e have never run
      # in CI despite the job being called "e2e". They run now.
      #
      # Split deliberately. "Does the site work" blocks the merge. "Is commerce
      # switched on" does not: golive.spec.js asserts a configured Stripe price,
      # which is false by design while COMMERCIAL_LAUNCH_ENABLED is off. Mixing
      # the two would mean a permanent red X that everyone learns to ignore.
      - name: Playwright e2e — site health, nav, locales, back-to-top
        run: npm run e2e:site

      - name: Go-live readiness (informational until commerce is enabled)
        continue-on-error: true
        run: npm run e2e:golive

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
