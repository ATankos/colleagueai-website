name: CI

"on":
  push:
    branches:
      - main
      - golive-fixes
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: HTML integrity gate (tag balance, leaked code, orphaned tags, anchors)
        run: node tests/integrity-check.mjs

      - name: Unit tests
        run: npm run test:run

      - name: Webhook security and idempotency
        run: node --test tests/webhook.test.mjs

      - name: Rate limiter
        run: node --test tests/ratelimit.test.mjs

      - name: DOM smoke
        run: node --test tests/dom-smoke.test.mjs
        continue-on-error: true

      - name: i18n integrity
        run: node tests/audit-i18n.mjs

      - name: Locale smoke (scripts execute in every language)
        run: node --test tests/locale-smoke.test.mjs
      - name: End-to-end journeys (buyer path, partner path, navigation, localisation)
        run: node --test tests/journey.test.mjs

      - name: Secret scan of build output
        run: node tests/scan-bundle.mjs

      - name: Headers and SEO audit against local replica
        run: |
          node tests/local-server.mjs 4173 &
          sleep 1
          BASE_URL=http://localhost:4173 node tests/audit-headers.mjs
        continue-on-error: true

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-results
          path: tests/results/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build and static QA audit
        run: npm run build && npm run qa:static

      # This job installed a browser but never used it: the step above is a
      # static Node audit, so the Playwright specs in tests/e2e have never run
      # in CI despite the job being called "e2e". They run now.
      - name: Playwright e2e — real browser, nav, drawer, demo, locales
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
